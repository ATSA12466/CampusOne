name: campusone
description: CampusOne student app for Android and iOS. Shared backend with the web platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  add_2_calendar: ^2.1.2
  app_links: ^6.4.1
  http: ^1.0.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.0
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.0
  url_launcher: ^6.3.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon-1024.png
    - assets/src-crest.png
