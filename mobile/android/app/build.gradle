plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter plugin; applied after the Android plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) { flutterVersionCode = "1" }

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) { flutterVersionName = "1.0.0" }

android {
    namespace = "com.campusone.app"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: replace with the client's Play Console application ID.
        applicationId = "com.campusone.app"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            // Filled in at release time; see docs/MOBILE_RELEASE.md.
            // storeFile, storePassword, keyAlias, keyPassword come from
            // key.properties (never committed).
            if (rootProject.file("key.properties").exists()) {
                def keyProps = new Properties()
                rootProject.file("key.properties").withInputStream { keyProps.load(it) }
                storeFile = file(keyProps["storeFile"])
                storePassword = keyProps["storePassword"]
                keyAlias = keyProps["keyAlias"]
                keyPassword = keyProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // google-services.json is required only when Firebase push is
            // configured; without it the app runs with the feed fallback.
        }
    }
}

flutter {
    source = "../.."
}
